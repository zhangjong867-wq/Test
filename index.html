 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Graphics Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover {
            transform: translateX(8px);
            background: rgba(59, 130, 246, 0.2);
        }
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #10b981;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <div id="app" class="w-full max-w-3xl">
        <!-- Start Screen -->
        <div id="start-screen" class="glass-card p-8 text-center fade-in">
            <div class="mb-6 inline-block p-4 bg-blue-600 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-4xl font-bold mb-4">Python Graphics Master</h1>
            <p class="text-slate-400 mb-8 text-lg">Проверьте свои знания в Turtle, Tkinter, Pygame и Matplotlib. 20 вопросов разной сложности.</p>
            <button onclick="quiz.start()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transition-all active:scale-95">
                Начать тест
            </button>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="hidden">
            <div class="flex justify-between items-center mb-4 px-2">
                <span id="question-counter" class="text-blue-400 font-semibold text-lg">Вопрос 1/20</span>
                <span id="score-counter" class="text-slate-400">Верно: 0</span>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
                <div id="progress" class="progress-bar bg-blue-500 h-full w-0"></div>
            </div>

            <div id="question-card" class="glass-card p-8 fade-in">
                <h2 id="question-text" class="text-2xl font-semibold mb-6 leading-relaxed"></h2>
                <div id="options-list" class="space-y-4">
                    <!-- Options generated by JS -->
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden glass-card p-10 text-center fade-in">
            <div id="result-icon" class="text-6xl mb-6"></div>
            <h2 id="result-title" class="text-3xl font-bold mb-2"></h2>
            <div id="result-score" class="text-5xl font-extrabold text-blue-500 mb-6"></div>
            <p id="result-msg" class="text-slate-300 mb-8 text-lg italic"></p>
            
            <div class="p-6 bg-slate-900/50 rounded-xl mb-8 border border-slate-700">
                <h3 class="font-semibold text-blue-400 mb-2">Ваше поздравление:</h3>
                <p id="congrats-text" class="text-xl"></p>
            </div>

            <button onclick="location.reload()" class="text-slate-400 hover:text-white transition-colors">
                Попробовать еще раз
            </button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Какая стандартная библиотека Python используется для создания простейшей черепашьей графики?",
                o: ["turtle", "tkinter", "pygame", "matplotlib"],
                a: 0
            },
            {
                q: "Какой метод в Tkinter используется для размещения виджетов по координатам?",
                o: ["pack()", "grid()", "place()", "locate()"],
                a: 2
            },
            {
                q: "В библиотеке Pygame, что делает функция pygame.display.flip()?",
                o: ["Поворачивает экран на 180 градусов", "Обновляет содержимое всего экрана", "Закрывает окно", "Очищает экран"],
                a: 1
            },
            {
                q: "Как в Turtle заставить черепашку рисовать быстрее?",
                o: ["turtle.fast(10)", "turtle.velocity(10)", "turtle.speed(0)", "turtle.set_fps(60)"],
                a: 2
            },
            {
                q: "Какая функция Matplotlib используется для создания круговой диаграммы?",
                o: ["plt.circle()", "plt.pie()", "plt.round()", "plt.arc()"],
                a: 1
            },
            {
                q: "Что делает команда turtle.penup()?",
                o: ["Поднимает перо (перестает рисовать)", "Увеличивает толщину линии", "Меняет цвет фона", "Завершает программу"],
                a: 0
            },
            {
                q: "Основной цикл событий в Tkinter запускается методом:",
                o: ["run()", "start()", "mainloop()", "execute()"],
                a: 2
            },
            {
                q: "В Pygame координаты (0, 0) находятся в:",
                o: ["Центре экрана", "Левом нижнем углу", "Правом верхнем углу", "Левом верхнем углу"],
                a: 3
            },
            {
                q: "Какой аргумент функции plt.plot() отвечает за цвет линии?",
                o: ["clr", "color", "stroke", "paint"],
                a: 1
            },
            {
                q: "Как создать окно в Tkinter?",
                o: ["root = Tk()", "window = Window()", "app = App()", "screen = Screen()"],
                a: 0
            },
            {
                q: "Что возвращает метод turtle.position()?",
                o: ["Угол поворота", "Текущие координаты (x, y)", "Цвет черепашки", "Список всех точек рисунка"],
                a: 1
            },
            {
                q: "Для чего используется библиотека Pillow (PIL)?",
                o: ["Для создания 3D игр", "Для обработки изображений", "Для построения графиков функций", "Для работы с видео"],
                a: 1
            },
            {
                q: "Метод pygame.Rect() используется для создания:",
                o: ["Окружности", "Текста", "Прямоугольной области", "Линии"],
                a: 2
            },
            {
                q: "Как в Matplotlib добавить заголовок к графику?",
                o: ["plt.header()", "plt.title()", "plt.label()", "plt.caption()"],
                a: 1
            },
            {
                q: "Какая команда Turtle очищает экран и возвращает черепашку в начало?",
                o: ["turtle.clear()", "turtle.reset()", "turtle.home()", "turtle.restart()"],
                a: 1
            },
            {
                q: "Виджет для ввода однострочного текста в Tkinter это:",
                o: ["Input", "TextField", "Entry", "Label"],
                a: 2
            },
            {
                q: "Чтобы Pygame обрабатывал нажатия клавиш, нужно проверять события:",
                o: ["pygame.KEYDOWN", "pygame.CLICK", "pygame.PRESS", "pygame.INPUT"],
                a: 0
            },
            {
                q: "Как в Matplotlib отобразить сетку на графике?",
                o: ["plt.net()", "plt.grid(True)", "plt.lines()", "plt.mesh()"],
                a: 1
            },
            {
                q: "Метод turtle.fillcolor() меняет:",
                o: ["Цвет контура", "Цвет заливки фигур", "Цвет холста", "Цвет пера"],
                a: 1
            },
            {
                q: "Какой модуль Pygame используется для работы со временем и FPS?",
                o: ["pygame.timer", "pygame.fps", "pygame.clock", "pygame.time"],
                a: 3
            }
        ];

        class Quiz {
            constructor() {
                this.currentIdx = 0;
                this.score = 0;
                this.isProcessing = false;
            }

            start() {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');
                this.renderQuestion();
            }

            renderQuestion() {
                this.isProcessing = false;
                const q = questions[this.currentIdx];
                document.getElementById('question-counter').innerText = `Вопрос ${this.currentIdx + 1}/${questions.length}`;
                document.getElementById('score-counter').innerText = `Верно: ${this.score}`;
                document.getElementById('progress').style.width = `${((this.currentIdx) / questions.length) * 100}%`;
                
                const qText = document.getElementById('question-text');
                const optionsList = document.getElementById('options-list');
                
                qText.innerText = q.q;
                optionsList.innerHTML = '';
                
                q.o.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/40 hover:border-blue-500 flex items-center";
                    btn.innerHTML = `
                        <span class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center mr-4 text-sm font-bold">${String.fromCharCode(65 + index)}</span>
                        <span>${opt}</span>
                    `;
                    btn.onclick = () => this.checkAnswer(index, btn);
                    optionsList.appendChild(btn);
                });
            }

            checkAnswer(idx, btn) {
                if (this.isProcessing) return;
                this.isProcessing = true;
                
                const correct = questions[this.currentIdx].a;
                const options = document.querySelectorAll('.option-btn');
                
                if (idx === correct) {
                    this.score++;
                    btn.classList.add('bg-green-600/30', 'border-green-500');
                } else {
                    btn.classList.add('bg-red-600/30', 'border-red-500');
                    options[correct].classList.add('bg-green-600/30', 'border-green-500');
                }

                setTimeout(() => {
                    this.currentIdx++;
                    if (this.currentIdx < questions.length) {
                        this.renderQuestion();
                    } else {
                        this.showResults();
                    }
                }, 1200);
            }

            showResults() {
                document.getElementById('quiz-container').classList.add('hidden');
                const resScreen = document.getElementById('result-screen');
                resScreen.classList.remove('hidden');

                const percent = (this.score / questions.length) * 100;
                const title = document.getElementById('result-title');
                const icon = document.getElementById('result-icon');
                const scoreDiv = document.getElementById('result-score');
                const congrats = document.getElementById('congrats-text');
                
                scoreDiv.innerText = `${this.score} / ${questions.length}`;

                if (percent === 100) {
                    icon.innerText = "🏆";
                    title.innerText = "Питон-Легенда!";
                    congrats.innerText = "Вы — настоящий мастер визуализации! Ваши знания библиотек графики безупречны. Вы можете создать любой интерфейс или игру с закрытыми глазами!";
                } else if (percent >= 80) {
                    icon.innerText = "🌟";
                    title.innerText = "Отличный результат!";
                    congrats.innerText = "Вы прекрасно разбираетесь в графических инструментах Python. Поздравляем с высоким уровнем мастерства!";
                } else if (percent >= 50) {
                    icon.innerText = "🥉";
                    title.innerText = "Хорошее начало!";
                    congrats.innerText = "Вы уверенно владеете основами. Еще немного практики, и вы сможете создавать сложные визуальные проекты!";
                } else {
                    icon.innerText = "📚";
                    title.innerText = "Нужно подтянуть теорию";
                    congrats.innerText = "Графика в Python — это увлекательно! Не сдавайтесь, изучите документацию Tkinter или Turtle еще раз, и успех обязательно придет.";
                }
            }
        }

        const quiz = new Quiz();
    </script>
</body>
</html>
